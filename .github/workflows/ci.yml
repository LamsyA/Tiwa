name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://tiwa:tiwa@localhost:5432/tiwa
      REDIS_URL: redis://localhost:6379
      APP_ENV: local
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start services
        run: pnpm db:up && docker ps

      - name: Migrate
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E (mobile + desktop)
        run: pnpm e2e

      - name: Lighthouse CI
        run: pnpm perf

      - name: Bundle budgets
        run: pnpm size

      - name: Stop services
        if: always()
        run: pnpm db:down
