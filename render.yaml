# Render blueprint for the Tiwa worker (D-X55). Render → New → Blueprint →
# pick this repo. Free web service so it gets a PORT and a /health page; an
# outside cron (cron-job.org) pings /health every 10 minutes so it never sleeps.
services:
  - type: web
    name: tiwa-worker
    runtime: docker
    plan: free
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      # Fill these in Render → tiwa-worker → Environment (never commit them).
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_PRIVATE
        value: tiwa-media-private
      - key: S3_BUCKET_PUBLIC
        value: tiwa-media-public
      - key: MEDIA_CDN_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TIWA_MUSE_API
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
